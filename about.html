{name:"Human Reproduction",icon:"🫶",desc:"Reproductive organs, pregnancy and development",match:/acrosome|gestation|fertili|ovipary|vivipary|ovovivipary|amniotic egg|yolk sac|allantois|altricial|precocial|parental care|uterus|seminal vesicle|cowper|prostate gland|vas deferens|urethra|testes|testosterone|fallopian|endometrium|ovary|cervix|vagina|mucus plug|implantation|chorion|amnion|umbilical|progesterone|corpus luteum|ovulation|oestrogen|epididymis|graafian|foetus|zygote/i},
{name:"Nervous System",icon:"⚡",desc:"Brain regions, neurons and reflexes",match:/meninges|parasympathetic|peripheral nervous|cerebrum|cerebellum|medulla|hypothalamus|corpus callosum|neuron|synapse|reflex|cranial nerve|myelin sheath|dendrite|axon|receptor|effector|adh|aldosterone|thyroid stimulating/i},
{name:"Senses: Eye & Ear",icon:"👁️",desc:"Vision, hearing and sensory structures",match:/lens|pupil|iris|aqueous|vitreous|blind spot|optic nerve|astigmatism|glaucoma|cataract|accommodation|pupillary|myopia|choroid|yellow spot|ciliary|cochlea|auditory canal|eustachian|glomet/i},
{name:"Evolution & Human Origins",icon:"🌍",desc:"Evidence, relationships and evolutionary change",match:/biogeography|theory|hypothesis|punctuated|artificial selection|species|speciation|natural selection|out of africa|phylogenetic|homologous|population|fossil|palaeontology|australopithecus|homo sapiens|homo habilis|variation|hominid|hominidae|hominin|prognathous/i},
{name:"Environment & Sustainability",icon:"🌱",desc:"Food systems, pest control and ecosystem impacts",match:/carbon footprint|food security|monoculture|herbicide|pesticide|sustainable|biological control|chemical control|eutrophication/i},
{name:"Scientific Investigations",icon:"📊",desc:"Variables, fair testing and investigation skills",match:/controlled variable|dependent variable|independent variable|hypothesis/i}
];
function categoryOf(term){for(const c of catDefs)if(c.match.test(term))return c.name;return "Life Sciences Foundations"}
const cats=[...catDefs,{name:"Life Sciences Foundations",icon:"📘",desc:"Core concepts and terms across the syllabus",match:null}];
const entries=terms.map((t,i)=>({id:i,term:t[0],def:t[1],category:categoryOf(t[0])}));
const storageKey="lish_academy_v2";let saved;try{saved=JSON.parse(localStorage.getItem(storageKey))||{seen:[],scores:[]}}catch{saved={seen:[],scores:[]}}
saved.seen=saved.seen||[];saved.scores=saved.scores||[];
let page=( ["home","cards","terms","quiz","score","about"].includes(location.pathname.split("/").pop().replace(".html","")) ? location.pathname.split("/").pop().replace(".html","") : "home"),selectedCat=(localStorage.getItem("lish_selected_category")||"All categories"),activeId=null,history=[],flipped=false,quiz=null;
const $=id=>document.getElementById(id);
function persist(){localStorage.setItem(storageKey,JSON.stringify(saved))}
function nav(){const links=[["home","⌂","Dashboard"],["cards","▣","Flashcards"],["terms","☷","Terminology"],["quiz","✓","Quiz Centre"],["score","↗","Scoreboard"],["about","ⓘ","Study guide"]];$("nav").innerHTML=links.map(x=>`<button class="${page===x[0]?"active":""}" onclick="go('${x[0]}')">${x[1]} &nbsp;${x[2]}</button>`).join("")}
function go(p){location.href=p+".html"}
function pct(n,total){return total?Math.round(n/total*100):0}
function catEntries(name){return entries.filter(e=>e.category===name)}
function progressFor(list){return list.filter(e=>saved.seen.includes(e.id)).length}
function dashboard(){const done=progressFor(entries);return `<section class="welcome"><div><div class="eyebrow">Small steps. Strong results.</div><h1>Learn smarter.<br>Reach your goals.</h1><p>Build confidence in Life Sciences with organised revision decks, 3D cards and quick knowledge checks.</p><button class="btn light" onclick="go('cards')">Continue studying →</button></div><div class="welcome-art">📚</div></section><div class="stats"><div class="stat"><span>Glossary cards</span><strong>${entries.length}</strong></div><div class="stat"><span>Cards completed</span><strong>${done}</strong></div><div class="stat"><span>New cards left</span><strong>${entries.length-done}</strong></div><div class="stat"><span>Quizzes completed</span><strong>${saved.scores.length}</strong></div></div><div class="section-head"><div><h2>Study by category</h2><p>Choose a subject deck to focus your revision.</p></div></div><div class="categories">${cats.map(c=>{let es=catEntries(c.name),d=progressFor(es);return `<button class="category" onclick="chooseCategory('${c.name.replace(/'/g,"\\'")}')"><div class="cat-top"><div class="cat-icon">${c.icon}</div><div><h3>${c.name}</h3><small>${es.length} cards · ${d} completed</small></div></div><p class="note">${c.desc}</p><div class="mini-bar"><i style="width:${pct(d,es.length)}%"></i></div></button>`}).join("")}</div>`}
function chooseCategory(c){selectedCat=c;localStorage.setItem("lish_selected_category",c);history=[];activeId=null;go("cards")}
function deck(){return selectedCat==="All categories"?entries:catEntries(selectedCat)}
function nextNew(){const candidates=deck().filter(e=>!saved.seen.includes(e.id));if(!candidates.length)return null;return candidates[0]}
function showCard(id){activeId=id;flipped=false;renderCard()}
function renderCard(){const list=deck(),done=progressFor(list),fresh=list.filter(e=>!saved.seen.includes(e.id));let e=activeId===null?null:entries.find(t=>t.id===activeId);if(!e||!list.some(x=>x.id===e.id)){e=fresh[0]||null;activeId=e?e.id:null}
const allDone=!e;const idx=e?list.findIndex(t=>t.id===e.id)+1:list.length;
$("view").innerHTML=`<div class="eyebrow">Active recall · Flashcard studio</div><h1 class="screen-title">3D Flashcards</h1><p class="sub">Turn a card over to reveal the definition. New cards are not repeated once completed.</p><div class="toolbar"><select aria-label="Choose deck" onchange="selectedCat=this.value;history=[];activeId=null;flipped=false;renderCard()">${["All categories",...cats.map(c=>c.name)].map(c=>`<option ${c===selectedCat?"selected":""}>${c}</option>`).join("")}</select><span class="status">${list.length} cards in deck</span></div><div class="flash-meta"><span>${selectedCat==="All categories"?"Complete glossary":selectedCat}</span><b>${done} / ${list.length} completed</b></div><div class="progress"><i style="width:${pct(done,list.length)}%"></i></div>${allDone?`<div class="panel empty"><div style="font-size:48px">🎉</div><h2>Deck complete!</h2><p>You have completed all new cards in this category.</p><button class="btn" onclick="revisitPrompt()">Review a completed card</button> <button class="btn ghost" onclick="go('home')">Back to categories</button></div>`:`<div class="flash-meta"><span class="status">${e.category}</span><span>Card ${idx} of ${list.length}</span></div><div class="stage"><div class="flipcard ${flipped?"flipped":""}" onclick="flip()"><div class="face"><div class="label">Term · Think before turning</div><h2>${esc(e.term)}</h2><div class="hint">Tap the card to reveal the answer</div></div><div class="face back"><div class="label">Definition</div><p>${esc(e.def)}</p><div class="hint">Tap the card to return</div></div></div></div><div class="card-actions"><button class="btn ghost" onclick="speakCard()">🔊 Listen</button><button class="btn ghost" onclick="flip()">${flipped?"Show term":"Reveal answer"}</button><button class="btn ghost" onclick="previous()">← Previous</button><button class="btn" onclick="advance()">Next card →</button></div><div class="tip">Progress is saved on this device. Previous lets you revisit earlier cards.</div>`}`
function esc(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function flip(){flipped=!flipped;renderCard()}
function speakCard(){const e=entries.find(x=>x.id===activeId);if(!e)return;if(!("speechSynthesis"in window)){alert("Speech playback is not available in this browser.");return}speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(e.term+". "+e.def);utter.lang="en-ZA";speechSynthesis.speak(utter)}
function advance(){const e=entries.find(x=>x.id===activeId);if(e&&!saved.seen.includes(e.id)){saved.seen.push(e.id);persist()}if(activeId!==null)history.push(activeId);activeId=null;flipped=false;renderCard()}
function previous(){if(history.length){activeId=history.pop();flipped=false;renderCard()}else if(activeId!==null){const done=deck().filter(e=>saved.seen.includes(e.id)&&e.id!==activeId);if(done.length){activeId=done[done.length-1].id;flipped=false;renderCard()}}}
function revisitPrompt(){const d=deck().filter(e=>saved.seen.includes(e.id));if(d.length){activeId=d[0].id;flipped=false;history=[];renderCard()}}
function renderTerms(){let q="";$("view").innerHTML=`<div class="eyebrow">Reference library</div><h1 class="screen-title">Terminology</h1><p class="sub">Search the glossary and filter it by category.</p><div class="toolbar"><input id="termSearch" placeholder="Search terms or definitions…" style="flex:1;min-width:210px" oninput="filterTerms()"><select id="termCat" onchange="filterTerms()"><option>All categories</option>${cats.map(c=>`<option>${c.name}</option>`).join("")}</select></div><div class="panel"><div id="termResults"></div></div>`;filterTerms()}
function filterTerms(){const q=($("termSearch")?.value||"").toLowerCase(),cat=$("termCat")?.value||"All categories";const res=entries.filter(e=>(cat==="All categories"||e.category===cat)&&(`${e.term} ${e.def}`).toLowerCase().includes(q));$("termResults").innerHTML=`<p class="note">${res.length} matching terms</p>${res.map(e=>`<div class="termrow"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(e.term)}</b><span class="note">${esc(e.category)}</span></div><p>${esc(e.def)}</p></div>`).join("")||"<p>No matching terms.</p>"}`}
const quizBank=[
["Which molecule carries hereditary information?","DNA",["DNA","Starch","Glucose","Lipid"]],
["Where does translation occur?","Ribosome",["Nucleus","Ribosome","Golgi body","Lysosome"]],
["During which meiotic phase does crossing over occur?","Prophase I",["Prophase I","Anaphase II","Telophase I","Metaphase II"]],
["Which blood vessel carries oxygen-rich blood from placenta to foetus?","Umbilical vein",["Umbilical artery","Umbilical vein","Aorta","Vena cava"]],
["Which brain region helps coordinate voluntary movement?","Cerebellum",["Cerebrum","Medulla oblongata","Cerebellum","Hypothalamus"]],
["Which hormone promotes water reabsorption in kidneys?","ADH",["Insulin","ADH","Oestrogen","Thyroxine"]],
["What is the usual site of fertilisation in humans?","Fallopian tube",["Uterus","Vagina","Fallopian tube","Ovary"]],
["What is a heterozygous genotype?","Two different alleles",["Two identical alleles","Two different alleles","No alleles","Only recessive alleles"]],
["What is the independent variable?","Factor deliberately changed",["Measured outcome","Factor deliberately changed","Factor kept constant","Final conclusion"]],
["What does a phylogenetic tree represent?","Possible evolutionary relationships",["Food chains","Cell structures","Possible evolutionary relationships","Climate zones"]],
["Which retinal area supports sharp colour vision?","Yellow spot",["Blind spot","Yellow spot","Choroid","Optic nerve"]],
["What does biological control use?","Natural enemies of pests",["Only herbicides","Natural enemies of pests","Fertilisers","Irrigation"]],
["Which structure connects cerebral hemispheres?","Corpus callosum",["Medulla","Corpus callosum","Cerebellum","Pituitary"]],
["What is a gene pool?","All alleles in a breeding population",["One organism's DNA","All alleles in a breeding population","Only dominant alleles","One chromosome pair"]],
["What is implantation?","Embryo embeds in endometrium",["Release of ovum","Fusion of gametes","Embryo embeds in endometrium","Birth of baby"]]
];
function startQuiz(){quiz={questions:[...quizBank].sort(()=>Math.random()-.5).slice(0,10),at:0,score:0,locked:false,history:[]};renderQuiz()}
function renderQuiz(){if(!quiz){$("view").innerHTML=`<div class="eyebrow">Knowledge check</div><h1 class="screen-title">Quiz Centre</h1><p class="sub">Try a randomized set of 10 Life Sciences multiple-choice questions.</p><div class="panel"><h2>Ready to test yourself?</h2><p>Answer choices are shuffled. Your score is saved when you finish.</p><button class="btn" onclick="startQuiz()">Start 10-question quiz →</button><p class="note">Practice questions are revision material, not an official NSC paper.</p></div>`;return}if(quiz.at>=quiz.questions.length){saved.scores.unshift({score:quiz.score,total:quiz.questions.length,when:new Date().toLocaleDateString()});persist();$("view").innerHTML=`<div class="eyebrow">Quiz completed</div><div class="panel empty"><div style="font-size:50px">🏆</div><h1 class="screen-title">${quiz.score} / ${quiz.questions.length}</h1><h2>${pct(quiz.score,quiz.questions.length)}% score</h2><p>Your result has been saved to your scoreboard.</p><button class="btn" onclick="quiz=null;startQuiz()">Try another set</button> <button class="btn ghost" onclick="go('score')">View scoreboard</button></div>`;return}
const item=quiz.questions[quiz.at],opts=[...item[2]].sort(()=>Math.random()-.5);quiz.opts=opts;$("view").innerHTML=`<div class="eyebrow">Quiz centre · Practice</div><h1 class="screen-title">Multiple choice</h1><div class="flash-meta"><span>Question ${quiz.at+1} of ${quiz.questions.length}</span><b>Score ${quiz.score}</b></div><div class="progress"><i style="width:${pct(quiz.at,quiz.questions.length)}%"></i></div><div class="panel"><h2>${esc(item[0])}</h2><div id="options">${opts.map((o,i)=>`<button class="quiz-choice" onclick="answerQuiz(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join("")}</div><p id="feedback" class="note"></p><button id="quizNext" class="btn" style="display:none" onclick="quiz.at++;renderQuiz()">Next question →</button></div>`}
function answerQuiz(n){if(quiz.locked)return;quiz.locked=true;const correct=quiz.questions[quiz.at][1],picked=quiz.opts[n];if(picked===correct)quiz.score++;[...$("options").children].forEach(b=>{const text=b.textContent.slice(3);if(text===correct)b.classList.add("correct");else if(text===picked)b.classList.add("wrong");b.disabled=true});$("feedback").textContent=picked===correct?"Correct! Well done.":"Not quite. Correct answer: "+correct;$("quizNext").style.display="inline-block"}
}
function renderScore(){const total=saved.scores.length,mean=total?Math.round(saved.scores.reduce((n,s)=>n+s.score/s.total,0)/total*100):0;$("view").innerHTML=`<div class="eyebrow">Your learning analytics</div><h1 class="screen-title">Scoreboard</h1><p class="sub">Review your quiz history and revision progress.</p><div class="stats"><div class="stat"><span>Cards completed</span><strong>${saved.seen.length} / ${entries.length}</strong></div><div class="stat"><span>Completion</span><strong>${pct(saved.seen.length,entries.length)}%</strong></div><div class="stat"><span>Quizzes finished</span><strong>${total}</strong></div><div class="stat"><span>Average quiz score</span><strong>${mean}%</strong></div></div><div class="panel"><h2>Category progress</h2>${cats.map(c=>{let l=catEntries(c.name),d=progressFor(l);return `<div style="margin:15px 0"><div style="display:flex;justify-content:space-between;gap:8px"><b>${c.icon} ${c.name}</b><span class="note">${d}/${l.length}</span></div><div class="mini-bar"><i style="width:${pct(d,l.length)}%"></i></div></div>`}).join("")}</div><div class="section-head"><h2>Quiz history</h2></div><div class="panel">${saved.scores.length?saved.scores.map((s,i)=>`<div class="termrow"><b>Attempt ${total-i} · ${s.score}/${s.total} (${pct(s.score,s.total)}%)</b><p>${esc(s.when)}</p></div>`).join(""):"<p>No completed quizzes yet. Your results will appear here.</p>"}</div>`}
function about(){return `<div class="eyebrow">Welcome to your revision space</div><h1 class="screen-title">Study guide</h1><div class="panel"><h2>How flashcards work</h2><p>Choose a deck category or the complete glossary. Think of the meaning, then reveal the definition. Use Listen for browser speech. Next marks a new card completed; Previous revisits a card in your session.</p><h2>Progress and privacy</h2><p>Progress and scores are saved locally in this browser. Clearing browser data or using another device/browser may reset or separate progress.</p><h2>Glossary coverage note</h2><p>This build organises the existing 199 flashcard entries from the previous app. Your pasted numbering runs to 229, but contains numbering gaps, repeated terms and omitted item numbers; numbering alone does not establish 229 complete unique definitions. Some study terms were also clarified or supplemented in the prior deck. Please compare with your source sheet before treating it as an exact transcription.</p><h2>Made for</h2><p><b>Created by Lish</b> · Grade 12 Life Sciences revision.</p></div>`}
function render(){if(page==="home")$("view").innerHTML=dashboard();else if(page==="cards")renderCard();else if(page==="terms")renderTerms();else if(page==="quiz")renderQuiz();else if(page==="score")renderScore();else $("view").innerHTML=about()}
nav();render();
</script></body></html>
